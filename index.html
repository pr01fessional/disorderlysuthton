<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disorderly Suthton | Official Wiki</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Damion&family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            color: white;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.50),
                    rgba(0, 0, 0, 0.50)
                ),
                url("pawnshop.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
        }


        /* =========================
           GAME LOGO
        ========================= */

        .logo {
            position: absolute;

            top: 28px;
            right: 32px;

            width: 105px;
            height: auto;

            z-index: 10;

            filter:
                drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));

            transition:
                transform 0.2s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {
            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 100px 30px 60px;
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            margin: 0;

            font-size: clamp(45px, 7vw, 90px);

            font-weight: 800;

            letter-spacing: 2px;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           OFFICIAL WIKI
        ========================= */

        .official {
            margin-top: 8px;

            font-family: 'Damion', cursive;

            font-size: 28px;

            letter-spacing: 1px;

            opacity: 0.9;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.7);
        }


        /* =========================
           DIVIDER
        ========================= */

        .line {
            width: min(850px, 80vw);

            height: 1px;

            background: rgba(255, 255, 255, 0.65);

            margin-top: 15px;

            margin-bottom: 25px;
        }


        /* =========================
           BUTTON CONTAINER
        ========================= */

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 12px;

            width: min(900px, 90vw);
        }


        /* =========================
           BUTTON
        ========================= */

        .button {
            position: relative;

            width: 100%;

            height: 68px;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            color: white;

            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.55);

            border-radius: 12px;

            background:
                rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(7px);

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }


        /* =========================
           BUTTON OVERLAY
        ========================= */

        .button::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                rgba(255, 255, 255, 0);

            transition:
                background 0.25s ease;
        }


        /* =========================
           BUTTON TEXT
        ========================= */

        .button span {
            position: relative;

            z-index: 2;

            font-family:
                'Roboto Condensed',
                sans-serif;

            font-size: 18px;

            font-weight: 700;

            letter-spacing: 1px;

            opacity: 0;

            transform:
                translateY(8px);

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.9);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }


        /* =========================
           DAMION BUTTON TEXT
        ========================= */

        .button .damion {
            font-family:
                'Damion',
                cursive;

            font-size: 23px;

            font-weight: 400;

            letter-spacing: 0;
        }


        /* =========================
           HOVER
        ========================= */

        .button:hover {
            transform:
                translateY(-4px);

            background:
                rgba(0, 0, 0, 0.58);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.55);
        }


        .button:hover::before {
            background:
                rgba(255, 255, 255, 0.05);
        }


        .button:hover span {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* =========================
           SECOND ROW
        ========================= */

        .button:nth-child(6) {
            grid-column: 2;
        }

        .button:nth-child(7) {
            grid-column: 3;
        }

        .button:nth-child(8) {
            grid-column: 4;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .buttons {
                grid-template-columns:
                    repeat(2, 1fr);

                width:
                    min(500px, 90vw);
            }

            .button:nth-child(6),
            .button:nth-child(7),
            .button:nth-child(8) {
                grid-column: auto;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 450px) {

            .page {
                padding-top: 90px;
            }

            .title {
                font-size: 42px;
            }

            .official {
                font-size: 24px;
            }

            .line {
                margin-top: 12px;

                margin-bottom: 22px;
            }

            .button {
                height: 65px;
            }

            .button span {
                font-size: 16px;
            }

            .button .damion {
                font-size: 20px;
            }

            .logo {
                width: 80px;

                top: 20px;
                right: 20px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         GAME LOGO
    ========================= -->

    <img
        class="logo"
        src="ds_logo.png"
        alt="Disorderly Suthton Logo"
    >


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="page">


        <!-- TITLE -->

        <h1 class="title">
            Disorderly Suthton
        </h1>


        <!-- OFFICIAL WIKI -->

        <div class="official">
            Official Wiki
        </div>


        <!-- DIVIDER -->

        <div class="line"></div>


        <!-- =========================
             8 WIKI BUTTONS
        ========================= -->

        <nav class="buttons">


            <!-- ROW 1 -->


            <a
                class="button"
                href="#"
            >
                <span>Game</span>
            </a>


            <a
                class="button"
                href="#"
            >
                <span class="damion">Characters</span>
            </a>


            <a
                class="button"
                href="#"
            >
                <span>Locations</span>
            </a>


            <a
                class="button"
                href="#"
            >
                <span class="damion">Lore</span>
            </a>


            <a
                class="button"
                href="#"
            >
                <span>Updates</span>
            </a>


            <!-- ROW 2 -->


            <a
                class="button"
                href="#"
            >
                <span>Items</span>
            </a>


            <a
                class="button"
                href="#"
            >
                <span class="damion">Guides</span>
            </a>


            <a
                class="button"
                href="#"
            >
                <span>Community</span>
            </a>


        </nav>

    </main>

</body>
</html>
