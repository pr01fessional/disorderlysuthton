<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disorderly Suthton | Official Wiki</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Damion&family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            color: white;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.50),
                    rgba(0, 0, 0, 0.50)
                ),
                url("thumbnail1.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {
            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            margin: 0;

            font-size: clamp(45px, 7vw, 90px);

            font-weight: 800;

            letter-spacing: 2px;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           OFFICIAL WIKI
        ========================= */

        .official {
            margin-top: 8px;

            font-family: 'Damion', cursive;

            font-size: 28px;

            letter-spacing: 1px;

            opacity: 0.9;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.7);
        }


        /* =========================
           DIVIDER
        ========================= */

        .line {
            width: min(850px, 80vw);

            height: 1px;

            background: rgba(255, 255, 255, 0.65);

            margin-top: 15px;

            margin-bottom: 25px;
        }


        /* =========================
           BUTTON CONTAINER
        ========================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

            width: min(950px, 90vw);
        }


        /* =========================
           IMAGE BUTTON
        ========================= */

        .button {
            position: relative;

            width: 150px;

            height: 78px;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            color: white;

            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.55);

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15)
                ),
                url("thumbnail1.png");

            background-size: cover;

            background-position: center;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        /* =========================
           BUTTON DARK OVERLAY
        ========================= */

        .button::before {
            content: "";

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0);

            transition:
                background 0.25s ease;
        }


        /* =========================
           BUTTON TEXT
        ========================= */

        .button span {
            position: relative;

            z-index: 2;

            font-family: 'Roboto Condensed', sans-serif;

            font-size: 17px;

            font-weight: 700;

            letter-spacing: 3px;

            opacity: 0;

            transform: translateY(8px);

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.9);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }


        /* =========================
           HOVER EFFECT
        ========================= */

        .button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.55);
        }


        .button:hover::before {
            background: rgba(0, 0, 0, 0.58);
        }


        .button:hover span {
            opacity: 1;

            transform: translateY(0);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .buttons {
                display: grid;

                grid-template-columns: 1fr 1fr;

                width: min(450px, 90vw);
            }

            .button {
                width: 100%;

                height: 75px;
            }

            .button:last-child {
                grid-column: 1 / 3;
            }

        }


        @media (max-width: 450px) {

            .title {
                font-size: 42px;
            }

            .official {
                font-size: 24px;
            }

            .line {
                margin-top: 12px;
                margin-bottom: 22px;
            }

            .button {
                height: 70px;
            }

        }

    </style>
</head>


<body>

    <main class="page">


        <!-- TITLE -->

        <h1 class="title">
            Disorderly Suthton
        </h1>


        <!-- DAMION FONT -->

        <div class="official">
            Official Wiki
        </div>


        <!-- DIVIDER -->

        <div class="line"></div>


        <!-- BUTTONS -->

        <nav class="buttons">


            <!-- GAME -->

            <a class="button" href="#">
                <span>GAME</span>
            </a>


            <!-- CHARACTERS -->

            <a class="button" href="#">
                <span>CHARACTERS</span>
            </a>


            <!-- LOCATIONS -->

            <a class="button" href="#">
                <span>LOCATIONS</span>
            </a>


            <!-- LORE -->

            <a class="button" href="#">
                <span>LORE</span>
            </a>


            <!-- UPDATES -->

            <a class="button" href="#">
                <span>UPDATES</span>
            </a>


        </nav>

    </main>

</body>
</html>
